#   image: alpine:3
#   needs:
#     - job: dast
#       artifacts: true
#   script:
#     - code=$(cat zap-out/zap.exit 2>/dev/null || echo 0)
#     - test "$code" = "0" || { echo "ZAP baseline a remonte des alertes non qualifiees"; exit 1; }
