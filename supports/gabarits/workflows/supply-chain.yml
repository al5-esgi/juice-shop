  #       run: docker build -f Dockerfile.ci -t juice-shop:ci .
  #     - name: Trivy image
  #       id: trivy
  #       continue-on-error: true
  #       uses: aquasecurity/trivy-action@v0.36.0
  #       with:
  #         version: v0.74.0
  #         scan-type: image
  #         image-ref: juice-shop:ci
  #         scanners: vuln
  #         severity: HIGH,CRITICAL
  #         format: sarif
  #         output: trivy-image.sarif
  #         exit-code: "1"
  #     - name: Upload SARIF vers l'onglet Security
  #       if: always() && hashFiles('trivy-image.sarif') != ''
